      # [updated_after_deleted] Ensure that the updated timestamp is not later than the deleted timestamp.: dDeleted IS NULL OR dUpdated <= dDeleted
      # [archived_after_deleted] Ensure that the archived timestamp is not earlier than the deleted timestamp.: dArchived IS NULL OR dDeleted IS NULL OR dArchived >= dDeleted