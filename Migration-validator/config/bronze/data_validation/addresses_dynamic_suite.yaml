      # [longitude_latitude_range] Ensure longitude and latitude values are within valid geographic ranges.: (dcLongitude IS NULL OR (dcLongitude >= -180 AND dcLongitude <= 180)) AND (dcLatitude IS NULL OR (dcLatitude >= -90 AND dcLatitude <= 90))
