              COUNT(DISTINCT LEDGER_DELINQUENCY_ID) AS ledger_delinquency_id_distinct_count,
              COUNT(DISTINCT COMPANY_UUID) AS company_uuid_distinct_count,
              COUNT(DISTINCT FACILITY_UUID) AS facility_uuid_distinct_count,
