      # ── ⑬ / ⑭ Duplicate Check (Business Key) ─────────────────────
      duplicate_check_business_key:
        source_table_name: events
        source: postgresql
        sourcequery: |
          SELECT
              id,
              COUNT(*) AS duplicate_count
          FROM public.events
          GROUP BY id
          HAVING COUNT(*) > 1;
        target_table_name: EVENTS
        target: snowflake
        targetquery: |
          SELECT
              ID,
              COUNT(*) AS duplicate_count
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.EVENTS
          WHERE _FIVETRAN_ACTIVE = TRUE
          GROUP BY ID
          HAVING COUNT(*) > 1;
        comparison_note: "Both queries should return 0 rows. Any row means duplicate business-key values exist."
