              COUNT(DISTINCT UPDATED_BY_TYPE) AS updated_by_type_distinct_count,
              COUNT(DISTINCT LEDGER_ID) AS ledger_id_distinct_count,
              COUNT(DISTINCT LEAD_ID) AS lead_id_distinct_count,
