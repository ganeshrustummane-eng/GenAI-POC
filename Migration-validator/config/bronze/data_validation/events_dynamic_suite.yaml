              COUNT(DISTINCT UPDATED_BY_ID) AS updated_by_id_distinct_count,
              COUNT(DISTINCT UNIT_ID) AS unit_id_distinct_count,
              COUNT(DISTINCT TENANT_ID) AS tenant_id_distinct_count,
              COUNT(DISTINCT SOURCE_ID) AS source_id_distinct_count,
              COUNT(DISTINCT FACILITY_ID) AS facility_id_distinct_count,
              COUNT(DISTINCT CREATED_AT) AS created_at_distinct_count,
              COUNT(DISTINCT UPDATED_AT) AS updated_at_distinct_count,
              COUNT(DISTINCT PARENT_EVENT_ID) AS parent_event_id_distinct_count,
              COUNT(DISTINCT RELATED_OBJECT_ID) AS related_object_id_distinct_count,
