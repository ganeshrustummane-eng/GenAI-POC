              ROUND(100.0 * SUM(CASE WHEN LEDGER_UUID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS ledger_uuid_null_pct,
              ROUND(100.0 * SUM(CASE WHEN UNIT_UUID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS unit_uuid_null_pct,
              ROUND(100.0 * SUM(CASE WHEN LEAD_UUID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS lead_uuid_null_pct,
              ROUND(100.0 * SUM(CASE WHEN RELATED_OBJECT_UUID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS related_object_uuid_null_pct,
              ROUND(100.0 * SUM(CASE WHEN CLIENT_APPLICATION_ID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS client_application_id_null_pct,
              ROUND(100.0 * SUM(CASE WHEN PAYMENT_INTENT_ID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS payment_intent_id_null_pct,
              COUNT(DISTINCT ID) AS id_distinct_count,
              COUNT(DISTINCT TYPE) AS type_distinct_count,
              COUNT(DISTINCT NEEDS_FOLLOWUP) AS needs_followup_distinct_count,
              COUNT(DISTINCT NEEDS_FOLLOWUP_BY) AS needs_followup_by_distinct_count,
