              COUNT(DISTINCT CLIENT_APPLICATION_ID) AS client_application_id_distinct_count,
              COUNT(DISTINCT PAYMENT_INTENT_ID) AS payment_intent_id_distinct_count
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.EVENTS WHERE _FIVETRAN_ACTIVE = TRUE;
        comparison_note: "Compare each _null_pct, _distinct_count, _min, _max, _sum column between source and target. Column names are identical so direct comparison is possible."

      # ── VALUE_DIST Value Distribution (needs_followup) ─────────────────────
      value_distribution_needs_followup:
        source_table_name: events
        source: postgresql
        sourcequery: |
          SELECT
              COALESCE(CAST(needs_followup AS TEXT), '<<NULL>>') AS value,
              COUNT(*) AS value_count
          FROM public.events
          GROUP BY COALESCE(CAST(needs_followup AS TEXT), '<<NULL>>')
          ORDER BY value_count DESC;
        target_table_name: EVENTS
        target: snowflake
        targetquery: |
          SELECT
              COALESCE(CAST(NEEDS_FOLLOWUP AS STRING), '<<NULL>>') AS value,
              COUNT(*) AS value_count
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.EVENTS WHERE _FIVETRAN_ACTIVE = TRUE
