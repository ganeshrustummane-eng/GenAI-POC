tables:
  addresses:
    validations:

      # ── ① / ② Row Count ─────────────────────
      row_count:
        source_table_name: addresses
        source: postgresql
        sourcequery: |
          SELECT COUNT(*) AS source_row_count
          FROM migration_validator_test.addresses;
        target_table_name: ADDRESSES
        target: snowflake
        targetquery: |
          SELECT COUNT(*) AS target_row_count
          FROM ATHENA_DATABASE_SNOWFLAKE.ATHENA_SCHEMA.ADDRESSES;
        comparison_note: "source_row_count must equal target_row_count"

      # ── ③ / ④ Full Data Validation (normalised) ─────────────────────
      full_data_validation_normalised:
        source_table_name: addresses
        source: postgresql
        sourcequery: |
          SELECT
              COALESCE(CAST(CAST(addressid AS TEXT) AS TEXT), '<<NULL>>') AS addressid_normalized,
              COALESCE(CAST(CAST(siteid AS TEXT) AS TEXT), '<<NULL>>') AS siteid_normalized,
              COALESCE(CAST(TRIM(smrmrs) AS TEXT), '<<NULL>>') AS smrmrs_normalized,
              COALESCE(CAST(TRIM(sfname) AS TEXT), '<<NULL>>') AS sfname_normalized,
              COALESCE(CAST(TRIM(smi) AS TEXT), '<<NULL>>') AS smi_normalized,
              COALESCE(CAST(TRIM(slname) AS TEXT), '<<NULL>>') AS slname_normalized,
              COALESCE(CAST(TRIM(scompany) AS TEXT), '<<NULL>>') AS scompany_normalized,
              COALESCE(CAST(TRIM(saddr1) AS TEXT), '<<NULL>>') AS saddr1_normalized,
              COALESCE(CAST(TRIM(saddr2) AS TEXT), '<<NULL>>') AS saddr2_normalized,
              COALESCE(CAST(TRIM(scity) AS TEXT), '<<NULL>>') AS scity_normalized
          FROM migration_validator_test.addresses;
        target_table_name: ADDRESSES
        target: snowflake
        targetquery: |
          SELECT
              COALESCE(CAST(CAST(ADDRESSID AS STRING) AS STRING), '<<NULL>>') AS addressid_normalized,
              COALESCE(CAST(CAST(SITEID AS STRING) AS STRING), '<<NULL>>') AS siteid_normalized,
              COALESCE(CAST(TRIM(SMRMRS) AS STRING), '<<NULL>>') AS smrmrs_normalized,
              COALESCE(CAST(TRIM(SFNAME) AS STRING), '<<NULL>>') AS sfname_normalized,
              COALESCE(CAST(TRIM(SMI) AS STRING), '<<NULL>>') AS smi_normalized,
              COALESCE(CAST(TRIM(SLNAME) AS STRING), '<<NULL>>') AS slname_normalized,
              COALESCE(CAST(TRIM(SCOMPANY) AS STRING), '<<NULL>>') AS scompany_normalized,
              COALESCE(CAST(TRIM(SADDR1) AS STRING), '<<NULL>>') AS saddr1_normalized,
              COALESCE(CAST(TRIM(SADDR2) AS STRING), '<<NULL>>') AS saddr2_normalized,
              COALESCE(CAST(TRIM(SCITY) AS STRING), '<<NULL>>') AS scity_normalized
          FROM ATHENA_DATABASE_SNOWFLAKE.ATHENA_SCHEMA.ADDRESSES;
        comparison_note: "Export both to CSV. Compare row-by-row — must be identical. All values are normalised so comparison is type-safe."

      # ── ⑤–⑫ combined Combined Aggregate Query (NULL% + DISTINCT + MIN/MAX) ─────────────────────
      combined_aggregate_query_null%_distinct_min_max:
        source_table_name: addresses
        source: postgresql
        sourcequery: |
          -- Includes: NULL% + DISTINCT + MIN/MAX
          -- One scan replaces 3 separate aggregate query types.
          SELECT
              COUNT(*) AS total_rows
              ROUND(100.0 * SUM(CASE WHEN addressid IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS addressid_null_pct
              ROUND(100.0 * SUM(CASE WHEN siteid IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS siteid_null_pct
              ROUND(100.0 * SUM(CASE WHEN smrmrs IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS smrmrs_null_pct
              ROUND(100.0 * SUM(CASE WHEN sfname IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS sfname_null_pct
              ROUND(100.0 * SUM(CASE WHEN smi IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS smi_null_pct
              ROUND(100.0 * SUM(CASE WHEN slname IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS slname_null_pct
              ROUND(100.0 * SUM(CASE WHEN scompany IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS scompany_null_pct
              ROUND(100.0 * SUM(CASE WHEN saddr1 IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS saddr1_null_pct
              ROUND(100.0 * SUM(CASE WHEN saddr2 IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS saddr2_null_pct
              ROUND(100.0 * SUM(CASE WHEN scity IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS scity_null_pct
              COUNT(DISTINCT addressid) AS addressid_distinct_count
              COUNT(DISTINCT siteid) AS siteid_distinct_count
              COUNT(DISTINCT smrmrs) AS smrmrs_distinct_count
              COUNT(DISTINCT sfname) AS sfname_distinct_count
              COUNT(DISTINCT smi) AS smi_distinct_count
              COUNT(DISTINCT slname) AS slname_distinct_count
              COUNT(DISTINCT scompany) AS scompany_distinct_count
              COUNT(DISTINCT saddr1) AS saddr1_distinct_count
              COUNT(DISTINCT saddr2) AS saddr2_distinct_count
              COUNT(DISTINCT scity) AS scity_distinct_count
              MIN(addressid) AS addressid_min
              MAX(addressid) AS addressid_max
              MIN(siteid) AS siteid_min
              MAX(siteid) AS siteid_max
          FROM migration_validator_test.addresses;
        target_table_name: ADDRESSES
        target: snowflake
        targetquery: |
          -- Includes: NULL% + DISTINCT + MIN/MAX
          SELECT
              COUNT(*) AS total_rows
              ROUND(100.0 * SUM(CASE WHEN ADDRESSID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS addressid_null_pct
              ROUND(100.0 * SUM(CASE WHEN SITEID IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS siteid_null_pct
              ROUND(100.0 * SUM(CASE WHEN SMRMRS IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS smrmrs_null_pct
              ROUND(100.0 * SUM(CASE WHEN SFNAME IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS sfname_null_pct
              ROUND(100.0 * SUM(CASE WHEN SMI IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS smi_null_pct
              ROUND(100.0 * SUM(CASE WHEN SLNAME IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS slname_null_pct
              ROUND(100.0 * SUM(CASE WHEN SCOMPANY IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS scompany_null_pct
              ROUND(100.0 * SUM(CASE WHEN SADDR1 IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS saddr1_null_pct
              ROUND(100.0 * SUM(CASE WHEN SADDR2 IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS saddr2_null_pct
              ROUND(100.0 * SUM(CASE WHEN SCITY IS NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 4) AS scity_null_pct
              COUNT(DISTINCT ADDRESSID) AS addressid_distinct_count
              COUNT(DISTINCT SITEID) AS siteid_distinct_count
              COUNT(DISTINCT SMRMRS) AS smrmrs_distinct_count
              COUNT(DISTINCT SFNAME) AS sfname_distinct_count
              COUNT(DISTINCT SMI) AS smi_distinct_count
              COUNT(DISTINCT SLNAME) AS slname_distinct_count
              COUNT(DISTINCT SCOMPANY) AS scompany_distinct_count
              COUNT(DISTINCT SADDR1) AS saddr1_distinct_count
              COUNT(DISTINCT SADDR2) AS saddr2_distinct_count
              COUNT(DISTINCT SCITY) AS scity_distinct_count
              MIN(ADDRESSID) AS addressid_min
              MAX(ADDRESSID) AS addressid_max
              MIN(SITEID) AS siteid_min
              MAX(SITEID) AS siteid_max
          FROM ATHENA_DATABASE_SNOWFLAKE.ATHENA_SCHEMA.ADDRESSES;
        comparison_note: "Compare each _null_pct, _distinct_count, _min, _max, _sum column between source and target. Column names are identical so direct comparison is possible."

      # ── AI-recommended business-rule checks ──────────────
      # Run as: SELECT COUNT(*) FROM <table> WHERE NOT (<cond>)
      # Any count > 0 = data quality issue.
      # These are not executable blocks — review and adapt manually.
      # [addressid_positive] Ensure that addressid values are positive.: addressid >= 0
      # [siteid_positive] Ensure that siteid values are positive.: siteid >= 0
      # [saddr1_not_empty_if_saddr2_present] Ensure that saddr1 is not empty if saddr2 is provided.: saddr2 IS NULL OR saddr1 IS NOT NULL
      # [scity_not_empty_if_saddr1_present] Ensure that scity is not empty if saddr1 is provided.: saddr1 IS NULL OR scity IS NOT NULL
      # [smi_length_check] Ensure that smi (middle initial) is either NULL or a single character.: smi IS NULL OR char_length(smi) = 1